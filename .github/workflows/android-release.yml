name: Build and publish Android release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Install Android API 36 tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Verify release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e "import fs from 'node:fs';const p=JSON.parse(fs.readFileSync('package.json'));if(process.env.TAG!=='v'+p.version)throw Error('Tag does not match package.json');"
      - run: npm ci
      - run: npm test
      - run: npm run android:prepare
      - name: Decode signing key
        env:
          ARCAD_KEYSTORE_BASE64: ${{ secrets.ARCAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ARCAD_KEYSTORE_BASE64"
          printf '%s' "$ARCAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcad.keystore"
          chmod 600 "$RUNNER_TEMP/arcad.keystore"
      - name: Native tests and signed GitHub APK
        working-directory: android
        env:
          IZCAD_KEYSTORE_FILE: ${{ runner.temp }}/arcad.keystore
          IZCAD_KEYSTORE_PASSWORD: ${{ secrets.ARCAD_KEYSTORE_PASSWORD }}
          IZCAD_KEY_ALIAS: ${{ secrets.ARCAD_KEY_ALIAS }}
          IZCAD_KEY_PASSWORD: ${{ secrets.ARCAD_KEY_PASSWORD }}
        run: bash gradlew testReleaseUnitTest assembleRelease -PARCAD_DISTRIBUTION=github --no-daemon --console=plain
      - name: Verify APK and prepare source archive and checksums
        run: |
          npm run android:verify:release -- android/app/build/outputs/apk/release/app-release.apk
          node scripts/release-assets.mjs android/app/build/outputs/apk/release/app-release.apk release-output "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arcad-view-${{ github.ref_name }}
          path: release-output/*
          if-no-files-found: error
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'This tag already has a release; existing assets will not be overwritten.'
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" release-output/* --draft --verify-tag --title "Arcad View $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > release-response.json
          node --input-type=module -e "import fs from 'node:fs';const r=JSON.parse(fs.readFileSync('release-response.json'));const sums=fs.readFileSync('release-output/SHA256SUMS.txt','utf8').trim().split('\n');for(const row of sums){const [sha,name]=row.split(/  /);const a=r.assets.find(a=>a.name===name);if(!a||a.digest!=='sha256:'+sha)throw Error('Uploaded asset digest mismatch: '+name);}"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/arcad.keystore"
