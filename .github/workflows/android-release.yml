name: Build and publish Android release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Inspect existing release and recovery artifact
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs inspect release-output
      - name: Restore original verified build after interruption
        if: steps.release.outputs.mode == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN_ID: ${{ steps.release.outputs.resume_run_id }}
        run: gh run download "$RESUME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "arcad-view-${GITHUB_REF_NAME}" --dir release-output
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: steps.release.outputs.mode == 'build'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: steps.release.outputs.mode == 'build'
        with:
          packages: 'platform-tools'
      - name: Install Android API 36 tools
        if: steps.release.outputs.mode == 'build'
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: npm ci
        if: steps.release.outputs.mode == 'build'
      - run: npm test
        if: steps.release.outputs.mode == 'build'
      - run: npm run android:prepare
        if: steps.release.outputs.mode == 'build'
      - name: Decode signing key
        if: steps.release.outputs.mode == 'build'
        env:
          ARCAD_KEYSTORE_BASE64: ${{ secrets.ARCAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$ARCAD_KEYSTORE_BASE64"
          printf '%s' "$ARCAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/arcad.keystore"
          chmod 600 "$RUNNER_TEMP/arcad.keystore"
      - name: Native tests and signed GitHub APK
        if: steps.release.outputs.mode == 'build'
        working-directory: android
        env:
          IZCAD_KEYSTORE_FILE: ${{ runner.temp }}/arcad.keystore
          IZCAD_KEYSTORE_PASSWORD: ${{ secrets.ARCAD_KEYSTORE_PASSWORD }}
          IZCAD_KEY_ALIAS: ${{ secrets.ARCAD_KEY_ALIAS }}
          IZCAD_KEY_PASSWORD: ${{ secrets.ARCAD_KEY_PASSWORD }}
        run: bash gradlew testReleaseUnitTest assembleRelease -PARCAD_DISTRIBUTION=github --no-daemon --console=plain
      - name: Verify APK and prepare source archive and checksums
        if: steps.release.outputs.mode == 'build'
        run: |
          npm run android:verify:release -- android/app/build/outputs/apk/release/app-release.apk
          node scripts/release-assets.mjs android/app/build/outputs/apk/release/app-release.apk release-output "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.release.outputs.mode == 'build'
        with:
          name: arcad-view-${{ github.ref_name }}
          path: release-output/*
          if-no-files-found: error
      - name: Verify matching public corresponding source
        if: steps.release.outputs.mode != 'published'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-public-source.mjs
      - name: Publish verified release
        if: steps.release.outputs.mode != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          ARCAD_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: node scripts/github-release.mjs publish release-output
      - name: Remove runner signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/arcad.keystore"
