apply plugin: 'com.android.application'

def appMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json'))
def releaseMetadata = new groovy.json.JsonSlurper().parse(rootProject.file('../release-config.json'))
def distribution = providers.gradleProperty('ARCAD_DISTRIBUTION').orElse('github').get()
if (!(distribution in ['github', 'play'])) throw new GradleException('ARCAD_DISTRIBUTION must be github or play.')

// Override this for the next unused code in Play Console without changing source.
def releaseVersionCode = providers.gradleProperty('IZCAD_VERSION_CODE').orElse(releaseMetadata.versionCode.toString()).get()
if (!(releaseVersionCode ==~ /[1-9][0-9]*/) || releaseVersionCode.toLong() <= 3 || releaseVersionCode.toLong() > 2100000000) {
    throw new GradleException('IZCAD_VERSION_CODE must be an integer from 4 to 2100000000, greater than every code already uploaded to Play Console.')
}

// Never commit credentials. Android Studio can also sign the unsigned release bundle.
def signingNames = ['IZCAD_KEYSTORE_FILE', 'IZCAD_KEYSTORE_PASSWORD', 'IZCAD_KEY_ALIAS', 'IZCAD_KEY_PASSWORD']
def signingValues = signingNames.collectEntries { name ->
    [(name): providers.environmentVariable(name).orElse(providers.gradleProperty(name)).orNull]
}
def signingSupplied = signingValues.values().any { it != null && !it.isEmpty() }
if (signingSupplied && !signingValues.values().every { it != null && !it.isEmpty() }) {
    throw new GradleException('Release signing requires all four IZCAD signing settings. Credentials are intentionally omitted from this message.')
}

android {
    ndkVersion '28.2.13676358'
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    namespace = "com.izcad.viewer"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        ndk { abiFilters.addAll((providers.gradleProperty('ARCAD_NATIVE_ABIS').orElse('arm64-v8a,armeabi-v7a,x86_64,x86').get()).split(',') as List) }
        externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release'; cFlags '-fvisibility=hidden' } }
        applicationId "com.izcad.viewer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode.toInteger()
        versionName appMetadata.version
        buildConfigField 'boolean', 'GITHUB_UPDATES', (distribution == 'github').toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures { buildConfig true }
    sourceSets {
        debug.manifest.srcFile "src/${distribution}/AndroidManifest.xml"
        release.manifest.srcFile "src/${distribution}/AndroidManifest.xml"
    }
    signingConfigs {
        if (signingSupplied) {
            release {
                storeFile file(signingValues.IZCAD_KEYSTORE_FILE)
                storePassword signingValues.IZCAD_KEYSTORE_PASSWORD
                keyAlias signingValues.IZCAD_KEY_ALIAS
                keyPassword signingValues.IZCAD_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            debuggable false
            if (signingSupplied) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
